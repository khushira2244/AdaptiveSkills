name: adaptive-labs
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: adaptive_labs
      POSTGRES_USER: adaptive_labs
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your local .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adaptive_labs -d adaptive_labs"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
